# ros2 run mm_manip manipulation_server --ros-args --params-file <this file>
# Top level: shared by every skill (ServerConfig). grasp: the grasp skill (GraspConfig).
mm_manip:
  ros__parameters:
    dry_run: true # true: plan + RViz only, nothing moves
    base_frame: base_link
    ee_frame: grasp_center_link

    fjt_action: /follow_joint_trajectory
    driver_joint:
      lift_joint: lift_joint
      arm_joint: arm_joint
      wrist_yaw_joint: wrist_yaw_joint
      wrist_pitch_joint: wrist_pitch_joint
      wrist_roll_joint: wrist_roll_joint

    no_split_action_timeout: 10.0
    max_step:
      lift_joint: 0.2
      arm_joint: 0.15
      wrist_yaw_joint: 0.8
      wrist_pitch_joint: 0.8
      wrist_roll_joint: 0.8
    fjt_mode: navigation # driver mode for FJT moves; velocity paths switch to velocity
    control_rate: 30.0 # Hz, velocity path commands
    path_settle_timeout: 5.0 # s allowed after a velocity path ends to arrive

    settle_time: 0.3 # s to wait after the arm stops, before detecting
    service_timeout: 5.0

    use_gripper: false # TODO[lnfu] gripper mechanism being repaired

    detect_service: /mm_perception/detect
    color_topic: /cameras_gripper/right/image_raw/compressed
    depth_topic: /cameras_gripper/stereo/image_raw/compressedDepth
    depth_compressed: true
    camera_info_topic: /cameras_gripper/right/camera_info
    sync_slop: 0.02 # s, max stamp difference within a color/depth/info triple
    snapshot_timeout: 2.0
    depth_band: 0.05 # m, drop mask pixels this far from the median depth

    grasp:
      base_dofs: "" # "" | "x" | "x,y" | "x,y,theta" | ...

      start_pose:
        lift_joint: 0.45
        arm_joint: 0.05
        wrist_yaw_joint: 0.0
        wrist_pitch_joint: 0.0
        wrist_roll_joint: 0.0

      grasp_wrist:
        wrist_yaw_joint: 0.0
        wrist_pitch_joint: 0.0
        wrist_roll_joint: 0.0

      pregrasp_distance: 0.10

      n_waypoints: 2 # stretch_driver stops at every point; arm-only approach is straight
      lift_height: 0.10
      free_yaw: true
      max_aim_yaw_deg: 10.0 # ~5 cm sideways; anything further is left to the base
      base_stage_arm: 0.35

      max_base_translation: 0.6 # m, per axis
      max_base_rotation_deg: 45.0

      base_max_linear: 0.1 # m/s, /cmd_vel closed loop on /wheel_odom; sentry caps it at 0.1 while the arm is out
      base_max_angular: 0.5 # rad/s
      base_linear_gain: 2.0 # 1/s, speed = gain * remaining distance; too high overshoots
      base_angular_gain: 2.0 # 1/s
      # Base moves allowed per grasp. After each one the object is detected again and
      # the grasp replanned (the base may move again), since a first look near the
      # image edge can be far off.
      max_base_moves: 3

      ik_accept_position_error: 0.015
      ik_accept_orientation_error_deg: 3.0

      gripper_max_opening: 0.10 # TODO[lnfu] measure
      closed_threshold: 0.0 # TODO[lnfu] from the empty vs holding test

    articulate:
      start_pose:
        lift_joint: 0.45
        arm_joint: 0.05
        wrist_yaw_joint: 0.0
        wrist_pitch_joint: 0.0
        wrist_roll_joint: 0.0

      gemini_model: gemini-robotics-er-2-preview
      gemini_thinking_level: low # minimal | low | medium | high: slower, better
      gemini_timeout: 20.0 # s
      image_max_side: 640 # px, the image is shrunk to this before upload
      quad_shrink: 0.15 # the door plane is fitted inside the corners, shrunk by this
      door_depth_band: 0.15 # m, around the median depth inside the door
      handle_offset: 0.03 # m, how far the handle sticks out of the door

      n_waypoints: 10 # on the opening arc, the grasp pose included
      # Base turn strategies tried for the arc besides "free": the base turns this
      # share of the door's turn. The plan opening furthest wins.
      base_turn_ratios: [0.3, 0.5, 0.7]
      max_base_translation: 0.6 # m, per axis
      max_base_rotation_deg: 90.0
      ik_accept_position_error: 0.01
      ik_accept_orientation_error_deg: 3.0

      # Velocity paths: m/s or rad/s, and how close each joint must end (m or rad).
      path_max_velocity:
        base_x: 0.05
        base_y: 0.05
        base_theta: 0.2
        lift_joint: 0.08
        arm_joint: 0.08
        wrist_yaw_joint: 0.6
        wrist_pitch_joint: 0.6
        wrist_roll_joint: 0.6
      path_tolerance:
        base_x: 0.01
        base_y: 0.01
        base_theta: 0.02
        lift_joint: 0.003
        arm_joint: 0.003
        wrist_yaw_joint: 0.01
        wrist_pitch_joint: 0.01
        wrist_roll_joint: 0.01
      tracking_gain: 2.0 # 1/s, 0 = feedforward only
      path_min_segment: 0.3 # s, shortest time between two waypoints
