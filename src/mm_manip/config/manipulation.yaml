# ros2 run mm_manip manipulation_server --ros-args --params-file <this file>
# Each name is in NOTE.md. frames, robot, camera, detect: read at startup only.
# The other names: read at the start of each goal (ros2 param set works).
mm_manip:
  ros__parameters:
    # ---- startup
    frames:
      base: base_link
      ee: grasp_center_link

    robot:
      fjt_action: /follow_joint_trajectory
      driver_joint:
        lift_joint: lift_joint
        arm_joint: arm_joint
        wrist_yaw_joint: wrist_yaw_joint
        wrist_pitch_joint: wrist_pitch_joint
        wrist_roll_joint: wrist_roll_joint
      fjt_mode: navigation
      control_rate: 30.0 # Hz
      path_settle_timeout: 5.0 # s
      no_split_action_timeout: 10.0 # s
      max_step:
        lift_joint: 0.2
        arm_joint: 0.15
        wrist_yaw_joint: 0.8
        wrist_pitch_joint: 0.8
        wrist_roll_joint: 0.8

    camera:
      color_topic: /cameras_gripper/right/image_raw/compressed
      depth_topic: /cameras_gripper/stereo/image_raw/compressedDepth
      depth_compressed: true
      camera_info_topic: /cameras_gripper/right/camera_info
      sync_slop: 0.02 # s
      timeout: 2.0 # s

    detect:
      service: /mm_perception/detect
      timeout: 5.0 # s
      depth_band: 0.05 # m

    # ---- each goal
    dry_run: true # plan and show in RViz only
    settle_time: 0.3 # s
    use_gripper: true

    gripper:
      joint: gripper_joint
      state_joint: gripper_finger_left_joint
      open: 80.0 # driver units
      closed: -40.0 # driver units
      closed_finger: 0.0 # rad, TODO[lnfu] measure
      holding_margin: 0.05 # rad
      still: 0.005 # rad
      stall_time: 0.3 # s
      timeout: 5.0 # s

    grasp:
      base_dofs: "" # "" | "x" | "x,y" | "x,y,theta"
      start_pose:
        lift_joint: 0.45
        arm_joint: 0.05
        wrist_yaw_joint: 0.0
        wrist_pitch_joint: 0.0
        wrist_roll_joint: 0.0
      grasp_wrist:
        wrist_yaw_joint: 0.0
        wrist_pitch_joint: 0.0
        wrist_roll_joint: 0.0
      pregrasp_distance: 0.10 # m
      n_waypoints: 2
      lift_height: 0.10 # m
      free_yaw: true
      max_aim_yaw_deg: 10.0
      base_stage_arm: 0.35 # m
      max_base_moves: 3
      gripper_max_opening: 0.10 # m, TODO[lnfu] measure
      ik:
        position_error: 0.015 # m
        orientation_error_deg: 3.0
      base_limits:
        translation: 0.6 # m, per axis
        rotation_deg: 45.0
      base_control:
        max_linear: 0.1 # m/s
        min_linear: 0.01 # m/s
        linear_gain: 2.0 # 1/s
        linear_tolerance: 0.01 # m
        max_angular: 0.5 # rad/s
        min_angular: 0.03 # rad/s
        angular_gain: 2.0 # 1/s
        angular_tolerance: 0.017453292519943295 # rad (1 deg)

    articulate:
      start_pose:
        lift_joint: 0.45
        arm_joint: 0.05
        wrist_yaw_joint: 0.0
        wrist_pitch_joint: 0.0
        wrist_roll_joint: 0.0
      gemini:
        model: gemini-robotics-er-2-preview
        thinking_level: low # minimal | low | medium | high
        timeout: 20.0 # s
        image_max_side: 640 # px
      door:
        quad_shrink: 0.15
        depth_band: 0.15 # m
        handle_offset: 0.01 # m
        handle_grasp_depth: 0.015 # m
        debug_dir: "" # "" = <ROS_LOG_DIR or ~/.ros/log>/door_debug
      n_waypoints: 10
      base_turn_ratios: [0.3, 0.5, 0.7]
      approach_arm: 0.25 # m
      ik:
        position_error: 0.01 # m
        orientation_error_deg: 3.0
      base_limits:
        translation: 0.6 # m, per axis
        rotation_deg: 90.0
      path:
        max_velocity: # m/s or rad/s
          base_x: 0.05
          base_y: 0.05
          base_theta: 0.2
          lift_joint: 0.08
          arm_joint: 0.08
          wrist_yaw_joint: 0.6
          wrist_pitch_joint: 0.6
          wrist_roll_joint: 0.6
        tolerance: # m or rad
          base_x: 0.005
          base_y: 0.005
          base_theta: 0.005
          lift_joint: 0.003
          arm_joint: 0.003
          wrist_yaw_joint: 0.01
          wrist_pitch_joint: 0.01
          wrist_roll_joint: 0.01
        gain: 2.0 # 1/s
        min_segment: 0.3 # s
